[project]
name = "minuteai"
version = "0.1.0"
description = "MinuteAI — grounded meeting intelligence"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "boto3>=1.34",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "anthropic>=0.70",
    "google-genai>=1.0",
    "numpy>=1.26",
    "rapidfuzz>=3.9",
    "rank-bm25>=0.2.2",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
# Heavy ML stack, split so deployments can pick. The code imports these lazily and
# degrades gracefully (hash embeddings, numpy search, regex-only NER) without them.
asr = ["faster-whisper>=1.0"]
diarization = ["pyannote.audio>=3.1,<4"]
retrieval = ["sentence-transformers>=3.0", "faiss-cpu>=1.8"]
nlp = ["spacy>=3.7"]
ml = ["minuteai[asr,diarization,retrieval,nlp]"]

# Evaluation harness (eval/). BERTScore is optional and pulls in torch.
eval = [
    "rouge-score>=0.1.2",
    "matplotlib>=3.8",
]
bertscore = ["bert-score>=0.3.13"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "moto[s3,dynamodb,server]>=5.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["minuteai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "E722"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
# key-design table in the module docstring
"minuteai/storage/schema.py" = ["E501"]
# transcript lines and recorded LLM responses read better unwrapped
"minuteai/samples.py" = ["E501"]
